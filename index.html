function rand(seed){let n=seed>>>0;return ()=>{n=(Math.imul(n,1664525)+1013904223)>>>0;return n/4294967296;};}
function hash(v){return [...String(v)].reduce((n,c)=>Math.imul(n,31)+c.charCodeAt(0)>>>0,73);}
function mix(list,r=Math.random){const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function ordered(list,r){
 const now=Date.now(),rank=q=>{const a=state.log[q.id];if(a?.due&&a.due<=now)return -1;if(!a)return 0;return 1+a.n;};

function smallTable(headers,rows){return `<table><thead><tr>${headers.map(v=>`<th scope="col">${h(v)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${h(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
function weatherChart(m){
 const hy=m.type==='hyther',left=38,right=318,top=15,bottom=118,rmax=Math.max(1,...m.rain),unit=rmax>400?200:rmax>160?100:50,maxP=Math.ceil(rmax/unit)*unit;
 const tmin=Math.floor((Math.min(...m.temp)-(hy?1:0))/10)*10,tmax=Math.ceil((Math.max(...m.temp)+1)/10)*10;
 const yTemp=v=>bottom-(v-tmin)/(tmax-tmin)*(bottom-top),yRain=v=>bottom-v/maxP*(bottom-top),xTemp=v=>left+(v-tmin)/(tmax-tmin)*(right-left),xMonth=i=>left+(i+.5)/12*(right-left);
 const label=(x,y,txt,anchor='middle',ink='#41415e',size=11)=>`<text x="${x}" y="${y}" fill="${ink}" font-size="${size}" text-anchor="${anchor}">${txt}</text>`;
 let svg='';if(hy){
  for(let v=tmin;v<=tmax;v+=10){let x=xTemp(v);svg+=`<path d="M${x} ${top}V${bottom}" stroke="#d1d0e0"/>`+label(x,bottom+13,v);}
  for(let p=0;p<=maxP;p+=unit){let y=yRain(p);svg+=`<path d="M${left} ${y}H${right}" stroke="#c2c4d7"/>`+label(left-5,y+4,p,'end');}
  const dots=m.temp.map((t,i)=>[xTemp(t),yRain(m.rain[i])]);svg+=`<path d="M${dots.map(p=>p.join(',')).join('L')}Z" stroke="#6853a4" stroke-width="2" fill="#ada2d633"/>`;
  dots.forEach(([x,y],i)=>{const special=[0,3,6,9].includes(i);svg+=`<circle cx="${x}" cy="${y}" r="${special?3.5:2.2}" fill="${special?'#a13e62':'#605694'}"/>`;if(special)svg+=label(x+(i===0?12:i===3?20:i===6?15:-14),y+(i===0?10:i===3?-4:i===6?0:-5),`${i+1}月`,'middle','#733b62');});
  svg+=label(left,11,'降水量(mm)','start')+label(right+13,bottom+27,'気温(℃)','end');
 }else{
  for(let p=0;p<=maxP;p+=unit){const y=yRain(p);svg+=`<path d="M${left} ${y}H${right}" stroke="#c4c4d7"/>`+label(right+4,y+3,p,'start','#3e5f8b');}
  for(let t=tmin;t<=tmax;t+=10)svg+=label(left-4,yTemp(t)+3,t,'end','#9d3853');
  m.rain.forEach((v,i)=>{const x=xMonth(i),y=yRain(v);svg+=`<rect x="${x-6.5}" y="${y}" width="13" height="${bottom-y}" fill="#6f93bd"/>`+label(x,bottom+13,i+1);});
  const pts=m.temp.map((v,i)=>[xMonth(i),yTemp(v)]);svg+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#a33759" stroke-width="2.4"/>${pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.2" fill="#a33759"/>`).join('')}`;
  svg+=label(left-6,11,'気温(℃)','end','#913e5a',10)+label(right+28,11,'雨(mm)','end','#3e5f8b',10)+label(right+10,bottom+14,'月','start');
 }
 return `<svg viewBox="0 0 355 148" role="img" aria-label="${hy?'月平均気温を横軸、月降水量を縦軸にしたハイサーグラフ':'月別の降水量を棒、平均気温を折れ線で表した雨温図'}。詳しい値は数値表を開くと読めます。" class="chart">${svg}</svg><details><summary>月別の数値表を開く</summary>${smallTable(['月','気温 (℃)','降水量 (mm)'],m.temp.map((t,i)=>[i+1,t,m.rain[i]]))}</details>`;
}
function material(q){const m=q.material;let content='';
 if(m.type==='table')content=smallTable(m.heads,m.rows);
 else if(m.type==='terrain'){
  content='<svg role="img" aria-label="アとウは尾根、イは沢、エは川に位置する" viewBox="0 0 320 160" style="width:100%;background:#f1f4dd"><g fill="none"><path d="M10 0 Q65 45 95 95 T190 160" stroke="#216495" stroke-width="7"/><path d="M220 8 L175 35 L155 55 L125 70 L95 95" stroke="#216495" stroke-width="2"/><path d="M90 0 L112 28 L135 40 M240 65 L230 95 L245 137" stroke="#93663d" stroke-width="4" stroke-dasharray="7 3"/></g><g fill="#24232f" font-size="13"><circle cx="112" cy="28" r="4"/><text x="54" y="19">ア キタペッ</text><circle cx="155" cy="55" r="4"/><text x="161" y="66">イ ヒガシナイ</text><circle cx="230" cy="95" r="4"/><text x="236" y="104">ウ ミナミペッ</text><circle cx="95" cy="95" r="4"/><text x="11" y="111">エ ニシナイ</text></g></svg><p>太い青線＝川（本流）　細い青線＝沢　茶色の破線＝尾根</p>';
 } else if(m.type==='layers'){
  const sites=[['ア',78,40],['イ',146,30],['ウ',77,102],['エ',154,102]];
  content=['駅からの距離','浸水想定区域'].map((title,i)=>{
   const layer=i?'<path d="M0 0H106L88 60H0Z M122 78H180V130H121Z" fill="#bca9dd" stroke="#594679"/>':'<circle cx="65" cy="63" r="50" fill="#d9edee" stroke="#14616b" stroke-dasharray="4 2"/>';
   return '<figure style="display:inline-block;width:min(100%,190px);margin:4px"><figcaption>'+title+'</figcaption><svg role="img" aria-label="'+(i?'浸水区域にアとエ、区域外にイとウ':'駅から500m以内にアとウ、円外にイとエ')+'" viewBox="0 0 180 130" style="width:100%;background:#faf8f4;border:1px solid #817789">'+layer+'<g fill="#252638" font-size="12" font-weight="bold"><text x="58" y="68">駅</text>'+sites.map(([k,x,y])=>'<circle cx="'+x+'" cy="'+y+'" r="3"/><text x="'+(x+4)+'" y="'+(y-3)+'">'+k+'</text>').join('')+'</g></svg><small>'+(i?'紫の範囲＝浸水想定区域':'破線の円＝駅から500m')+'</small></figure>';
  }).join('');
 }
 else if(m.type==='note')content=`<ul>${m.lines.map(t=>`<li>${h(t)}</li>`).join('')}</ul>`;
 else if(m.type==='grid'){const shades=['#f2f0f7','#c4bddb','#8778ad','#534478'];content=`<table><thead><tr><th>方位</th>${m.cols.map(x=>`<th scope="col">${h(x)}</th>`).join('')}</tr></thead><tbody>${m.rows.map((row,i)=>`<tr><th scope="row">${h(m.labels[i])}</th>${row.map((t,j)=>`<td style="background:${shades[m.values[i][j]]};color:${m.values[i][j]>1?'white':'#2b2942'}">${h(t)}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="chartlegend">${h(m.legend)}</div>`;}
 else content=weatherChart(m);
 return `<div class="paper"><h3>${h(m.title)} ${q.source.startsWith('模式資料')?'<small>· 模式資料</small>':''}</h3>${content}</div>`;
}

 const a=state.sessions[sessionKey];if(!a)return home();if(a.intro)return concertPreview(a);

 else if(a.results.length===a.ids.length)body=finish(a);
 else{const q=sessionQuestion(a,a.results.length);body=`<article class="question"><div class="row"><span class="micro">${icon('ticket',15)} ${h(q.field)}</span><small class="mode-note">${({terrain:'模式地図',layers:'重ね合わせ地図',table:'統計表・比較表',note:'調査メモ',grid:'分布図',hyther:'ハイサーグラフ',climate:'雨温図'})[q.material.type]}</small></div>${a.tutorial?'<div class="mc"><strong>ソラ</strong><p>'+h(lessonCues[q.id])+'</p></div>':''}<h2>${h(q.prompt)}</h2>${material(q)}${q.material.claims?'<p class="claims">'+h(q.material.claims)+'</p>':''}${btn('ヒント（減点なし）','hint','','tiny')}<div class="answers">${answersOrder(a,q).map((k,i)=>`<button class="choice" data-act="answer" data-val="${k}"><span>${'ABCD'[i]}</span><span>${h(q.choices[k])}</span></button>`).join('')}</div></article>${a.mode==='daily'?`<div class="mc"><strong>${h(current().name)} · DAILY MC</strong><p>${h(mc(current(),'daily'))}</p></div>`:''}`;}
 return `<div class="quiz-shell">${quizProgress(a)}${body}${saved?'':'<p class="status-note">この画面では記録を一時保持しています。ホームの「遊び方・保存」から書き出せます。</p>'}</div>`;

function feedback(a){
 const i=a.results.length-1,r=a.results[i],q=sessionQuestion(a,i),right=q.answer===r.choice,c=state.chars[r.char]||current();
 const others=answersOrder(a,q).filter(k=>k!==q.answer).sort((x,y)=>Number(y===r.choice)-Number(x===r.choice));

 const earned=(r.prints||[]).map(k=>photoTiers[k]).filter(Boolean);
 return `<article class="panel answer-result ${right?'good':'again'}"><div class="row"><span class="micro">${right?'GOOD CALL':'ENCORE NOTE'}</span><span class="chip">+${right?10:3} PT &nbsp;·&nbsp; 好感度 +${(right?2:1)+regionalBonus(q,c)}</span></div><h2>${h(mc(c,right?'right':'again'))}</h2>${!right?`<small class="mode-note">${r.choice<0?'タイムアップ。ここで時計はストップ。':`あなたの回答：${h(q.choices[r.choice])}`} · 復習帳に追加</small>`:''}<p class="lead">${right?icon('mark',17)+' 正解　':'正解は：'}${h(q.choices[q.answer])}</p><div class="mc"><strong>${h(c.name)} のMC · ${h(c.personality)}</strong><p>${h(mc(c,'explain',q,right))}</p></div>${r.stage>=0?`<div class="reward">${icon('flag',17)} ${stops.slice((r.fromStage??r.stage-1)+1,r.stage+1).map((s,j)=>'<p>'+s[0]+'公演が解放！ '+h(storyData.cities[s[0]].arrive)+'</p>').join('')} ${btn('開演を見る','live',r.stage,'tiny')}</div>`:''}${unlock?`<p class="reward">${unlock}</p>`:''}${earned.map(t=>`<p class="reward">${icon('heart',15)} 限定ブロマイド「${t.title}」を獲得！</p>`).join('')}<div class="quiz-foot">${btn(i===a.ids.length-1?'ライブ結果へ':'次の問題へ','next','','primary','arrow')}</div><details class="reasons mt" open><summary>ほかの選択肢を見る</summary>${others.map(k=>`<div class="reason"><b>${h(q.choices[k])}${k===r.choice?'（あなたの回答）':''}</b><br>${h(q.why[k])}</div>`).join('')}</details><details class="reasons"><summary>問題と資料を見返す</summary><p>${h(q.prompt)}</p>${material(q)}${q.material.claims?'<p class="claims">'+h(q.material.claims)+'</p>':''}</details>${sourceLine(q)}</article>`;
}
function finish(a){const n=a.results.filter((r,i)=>r.choice===questions.get(a.ids[i]).answer).length;return `<div class="panel finish"><div class="micro" style="justify-content:center">${icon('spark',16)} LIVE COMPLETE</div><h2>${a.mode==='daily'?'デイリーツアー完走！':'ライブ、おつかれさま！'}</h2><div class="finishnum">${n} <small>/ ${a.ids.length} 問正解</small></div><div class="pills" style="justify-content:center"><span class="chip">獲得 ${n*10+(a.ids.length-n)*3} PT</span>${a.mode==='daily'?`<span class="chip">${streak()}日連続</span>`:''}</div>${afterShow(a,n)}<div class="quiz-foot" style="justify-content:center">${!state.chosen?btn('推しを選ぶ','favorite','','primary'):btn('ツアーホームへ','go','home','primary','home')}${btn('メンバーへ','go','members','sub','heart')}</div></div>`;}
function tick(){
 const a=state.sessions[sessionKey];if(page!=='quiz'||!a||a.intro||a.feedback||a.mode!=='exam'||a.results.length>=a.ids.length)return;
 const remaining=Math.max(0,Math.ceil((a.deadline-Date.now())/1000));if(!remaining){markAnswer(-1);return;}
 if($('seconds')){$('seconds').textContent=remaining;$('timer').classList.toggle('urgent',remaining<=15);}
}

function toast(t){$('notice').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('notice').textContent='';},2800);}
function closeDialog(){const d=$('overlay');if(d.open)d.close();}
function showDialog(title,html){const d=$('overlay');$('dialogcontent').innerHTML=`<div class="dialogpad"><div class="dialogtop"><h2 id="dialogtitle">${h(title)}</h2><button class="circle" data-act="close" aria-label="閉じる">${icon('close')}</button></div>${html}</div>`;if(!d.open)d.showModal();d.scrollTop=0;}
function go(next){if(next!=='quiz'&&page==='quiz'&&!state.chosen&&state.sessions.normal?.results.length===3&&!state.sessions.normal.feedback){chooseFavorite();return;}if(!['home','map','members','stats','fields','review','exam','quiz'].includes(next))return;closeDialog();page=next;if(next==='members')editing=state.pick;render(true);}
function render(top=false){
 clearInterval(ticker);const a=state.sessions[sessionKey];
 if(page==='quiz'&&(!a||a.mode==='daily'&&a.date!==dayKey()))page='home';
 document.body.classList.toggle('playview',page==='quiz');header();
 const pages={home,map:mapPage,members:membersPage,stats:statsPage,fields:fieldsPage,review:reviewPage,exam:examPage,quiz:quizPage};
 $('screen').innerHTML=pages[page]();if(top){$('screen').scrollTop=0;window.scrollTo(0,0);try{$('screen').focus({preventScroll:true});}catch(e){}}
 if(page==='quiz'&&a?.mode==='exam'&&!a.intro&&!a.feedback&&a.results.length<a.ids.length){ticker=setInterval(tick,250);tick();}
}
function infoDialog(){navigator.serviceWorker?.ready.then(()=>{const el=document.getElementById("offline-state");if(el)el.textContent="通信なしで起動できます。";});showDialog('遊び方・保存',`<p>札幌発のATLAS✦BEATと世界を巡ろう。まずは「ミニライブ開演」から3問。正解は10 PT、迷った問題にも3 PTが入ります。</p><details open><summary>デイリーと連続日数</summary><p>1日に10問、9分野すべてが登場します。1問ごとに記録し、同じ日の続きから再開できます。10問でその日のスタンプを獲得。日付は端末の現地時間で切り替わります。</p></details><details><summary>推しメンとコレクション</summary><p>「メンバー」で気になる子を選び「この子を推す」。その子がMCとデイリーの応援を担当します。好感度2・12・30でブロマイドを入手。アクセサリーや衣装は一度ポイントで購入すると何度でも着替えられます。</p></details><details><summary>ホーム画面への追加</summary><p>Chromeの︙またはSamsung Internetの☰からホーム画面に追加できます。</p><p id="offline-state">通信なし起動の準備を確認中…</p></details><details><summary>記録の移し替え・バックアップ</summary><p>進捗はこのブラウザと保存先に結びつきます。移動やブラウザのデータ消去前に「記録を書き出す」で文字列をコピー。移動先の同じゲームで貼り付けて復元できます。</p><div class="tag-row">${btn('記録を書き出す','export','','sub')}${btn('記録を読み込む','import','','sub')}</div></details><details><summary>収録問題と資料</summary><p>「地理総合、地理探究」向けオリジナル${BANK.length}問です。実際の統計には年と出典を記載。作問用に設定した値は「模式資料」と表示します。出典名とURLは解説の末尾で確認できます。</p></details>`);}
function live(i){if(!Number.isInteger(i)||!stops[i]||i>stageIndex())return;const s=stops[i],c=current();const glitter=Array.from({length:15},(_,n)=>`<i style="left:${(n*37+3)%97}%;top:${(n*17+4)%89}%;animation-delay:-${n%5*.3}s">${n%3===0?'✦':'✧'}</i>`).join('');
 showDialog(`${s[0]}公演`, `<div class="concert" style="--glow:${['#9183c9','#c17bb5','#74a4b2','#ba9076','#b79860','#6a9a88'][i%6]}"><div class="sparkles" aria-hidden="true">${glitter}</div>${art(c)}<div class="concert-label"><small>LIVE IN ${h(s[5])}</small>${h(s[6])}</div></div><div class="mc"><strong>${h(c.name)} · ${h(s[0])} MC</strong>${scene(i).live.map((line,j)=>'<p>'+h(line)+'</p>').join('')}</div>${btn('ライブを閉じる','close','','primary full')}`);beep('right');
}
function photo(k){const c=state.chars[editing],t=photoTiers[k];if(!t||c.bond<t.n)return;showDialog(t.title,`<div class="photo" style="--photo:${t.bg}">${art({...c,outfit:t.outfit}).replace('<svg ','<svg style="height:260px" ')}<div class="photofoot"><b>${h(c.name)} / ${t.title}</b><small>ATLAS✦BEAT　LIMITED PRINT　0${k+1}</small></div></div>`);}
function draftCost(c,data){const items=[data.get('hair'),data.get('outfit')];return items.reduce((s,k)=>s+(c.owned.includes(k)?0:prices[k]??0),0);}
function updatePreview(form){
 const c=state.chars[editing],raw=new FormData(form),cost=draftCost(c,raw),required=requirements[raw.get('outfit')]||0;
 const draft={...c,color:color(raw.get('color'),c.color),hair:raw.get('hair'),outfit:raw.get('outfit')};
 $('charpreview').innerHTML=`${art(draft)}<b>${h(raw.get('name')||c.name)}</b><small class="chip">${h(c.region)}担当 · 好感度 ${c.bond}</small>`;
 $('stylecost').textContent=correctTotal()<required?`衣装解放まであと${required-correctTotal()}問正解`:cost?`購入 ${cost} PT · 所持 ${state.points} PT`:'着替え・設定変更　0 PT';
}
function applyStyle(form){const c=state.chars[editing],d=new FormData(form);
 const hair=d.get('hair'),outfit=d.get('outfit');if(!Object.hasOwn(hairNames,hair)||!Object.hasOwn(outfitNames,outfit)||!toneList.includes(d.get('tone')))return;
 const cost=draftCost(c,d),req=requirements[outfit]||0;if(correctTotal()<req){toast(`あと${req-correctTotal()}問正解で衣装が解放されるよ。`);return;}if(state.points<cost){toast(`あと${cost-state.points} PTでこのコーデにできるよ。`);return;}
 const name=String(d.get('name')).trim(),line=String(d.get('line')).trim(),personality=String(d.get('personality')).trim();if(!name||!line||!personality){toast('名前・性格・決めゼリフを入力してね。');return;}
 state.points-=cost;Object.assign(c,{name:name.slice(0,16),personality:personality.slice(0,24),line:line.slice(0,64),color:color(d.get('color'),c.color),hair,outfit,tone:d.get('tone'),wish:String(d.get('wish')).trim().slice(0,240),owned:[...new Set([...c.owned,hair,outfit])]});save();render();toast(saved?(cost?`${cost} PTでコーデを購入・保存したよ！`:'キャラ設定を保存したよ！'):'この画面に反映したよ。記録は書き出してね。');
}
function addDialog(){if(correctTotal()<18||state.chars.length>=12)return;showDialog('新メンバーをプロデュース',`<form id="newmember"><div class="formgrid"><label>名前<input maxlength="16" required name="name" placeholder="ステージネーム"></label><label>担当地域<input maxlength="22" required name="region" placeholder="例：北ヨーロッパ"></label><label class="wide">メンバーカラー<input name="customcolor" type="color" value="#98cdda"></label><label>初期の口調・性格<select name="face">${base.map(([name],i)=>`<option value="${i}">${name}タイプ</option>`).join('')}</select></label></div><button type="submit" class="primary full mt">ツアーに加入</button></form>`);}
function exportDialog(){showDialog('記録を書き出す',`<p>下の記録をコピーして、メモなどに保管してください。</p><label class="sr" for="savedata">ゲームの記録</label><textarea id="savedata" readonly></textarea>${btn('記録をコピー','copy','','primary full mt')}`);$('savedata').value=JSON.stringify(state);}
function importDialog(){showDialog('記録を読み込む',`<p>書き出した文字列を貼り付けてください。内容を確認してから復元できます。</p><label class="sr" for="importdata">復元する記録</label><textarea id="importdata" placeholder="記録を貼り付け"></textarea>${btn('内容を確認','inspect','','sub full mt')}`);}
let importCandidate=null;
function inspectImport(){try{const str=$('importdata').value;if(str.length>500000)throw Error();importCandidate=cleanState(JSON.parse(str));const x=importCandidate;showDialog('この記録を復元しますか',`<p>推し ${h(x.chars[x.pick].name)} ／ ${x.points} PT ／ 回答 ${Object.values(x.log).reduce((t,r)=>t+r.n,0)}回</p><p>この端末の現在の記録は、読み込んだ内容に置き換わります。</p><div class="tag-row">${btn('キャンセル','close')}${btn('この記録に復元','restore','','primary')}</div>`);}catch(e){importCandidate=null;toast('記録を読み取れませんでした。全文を貼り付けてね。');}}
document.addEventListener('click',async e=>{
 const item=e.target.closest('button[data-act]');if(!item||item.disabled)return;const a=item.dataset.act,v=item.dataset.val||'',i=Number(v);
 switch(a){
 case 'orient':if(introStep<2){introStep++;welcome();}else endWelcome();break;case 'skip':endWelcome();break;
 case 'hint':{const a=state.sessions[sessionKey];if(!a||a.feedback||a.intro||a.results.length>=a.ids.length)break;const q=sessionQuestion(a,a.results.length);item.outerHTML='<div class="mc" role="status"><strong>'+h(current().name)+'のヒント</strong><p>'+h(q.tip)+'</p></div>';break;}
 case 'begin':beginShow();break;case 'stars':starbook();break;case 'finale':finale();break;case 'favorite':chooseFavorite();break;
 case 'firstpick':if(!state.chosen&&i>=0&&(i<5||(i===5&&correctTotal()>=12))){state.pick=editing=i;state.chosen=true;save();closeDialog();render();}break;
 case 'go':go(v);break;case 'start':start(v);break;case 'field':start('field',fields[i]);break;case 'answer':if(Number.isInteger(i)&&i>=0&&i<4)markAnswer(i);break;case 'next':nextQuestion();break;
 case 'close':closeDialog();break;case 'help':infoDialog();break;case 'live':live(i);break;case 'photo':photo(i);break;
 case 'member':if(!state.chars[i]||i>=5&&correctTotal()<12)break;editing=i;render();requestAnimationFrame(()=>{const form=$('styling');if(form&&window.innerWidth<=700)form.closest('.panel').previousElementSibling.scrollIntoView({block:'start'});});break;
 case 'pick':if(!state.chosen){toast('最初のライブのあとで推しを選ぼう。');break;}if(!state.chars[i]||i>=5&&correctTotal()<12)break;state.pick=editing=i;save();render();toast(`${state.chars[i].name}がこれから応援するよ！`);break;
 case 'sound':state.sound=!state.sound;save();header();if(state.sound)beep('right');toast(`効果音 ${state.sound?'オン':'オフ'}`);break;
 case 'add':addDialog();break;case 'export':exportDialog();break;case 'import':importDialog();break;case 'inspect':inspectImport();break;
 case 'restore':if(importCandidate){state=importCandidate;importCandidate=null;editing=state.pick;save();go('home');toast('記録を復元しました');}break;
 case 'copy':{const box=$('savedata');box.focus();box.select();try{await navigator.clipboard.writeText(box.value);toast('コピーしました');}catch(e){let copied=false;try{copied=document.execCommand('copy');}catch(ignore){}toast(copied?'コピーしました':'選択した記録をコピーしてね。');}break;}
 }
});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='styling')applyStyle(e.target);
 if(e.target.id==='newmember'&&correctTotal()>=18&&state.chars.length<12){
  const d=new FormData(e.target),face=Number(d.get('face')),name=String(d.get('name')).trim().slice(0,16),region=String(d.get('region')).trim().slice(0,22);if(!base[face]||!name||!region){toast('名前と担当地域を入力してね。');return;}
  const c=defaultChar(face);Object.assign(c,{name,region,custom:true,color:color(d.get('customcolor'),c.color)});state.chars.push(c);editing=state.chars.length-1;save();closeDialog();render(true);toast(`${name}がツアーに加入！`);
 }});
document.addEventListener('input',e=>{if(e.target.form?.id==='styling'&&['hair','outfit','color','name'].includes(e.target.name))updatePreview(e.target.form);});
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay')){const b=e.target.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)closeDialog();}});
$('overlay').addEventListener('close',()=>{importCandidate=null;if(!state.welcomed){state.welcomed=true;save();}});
function refreshDay(){const today=dayKey();if(today!==lastDay){lastDay=today;if(page==='quiz'&&state.sessions[sessionKey]?.mode==='daily'){go('home');toast('新しい日のデイリーが届いたよ！');}else if(!['quiz','members'].includes(page))render();}tick();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDay();});window.addEventListener('pageshow',refreshDay);setInterval(refreshDay,30000);
window.addEventListener('storage',e=>{if(e.key===storageKey&&e.newValue){try{state=cleanState(JSON.parse(e.newValue));editing=Math.min(editing,state.chars.length-1);if(page!=='members'||!$('styling')?.contains(document.activeElement))render();}catch(ignore){}}});
try{localStorage.setItem(storageKey+'.probe','1');localStorage.removeItem(storageKey+'.probe');}catch(e){saved=false;}
render();if(!state.welcomed)welcome();

</script>
<script>if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('./sw.js').catch(console.error);</script></body></html>
